spring.application.name=Gestion-Academica-App
# CONFIGURACIÓN DE CONEXIÓN (Ajusta 'NombreDeTuBaseDeDatos' por el nombre real de tu BD)


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BD_GESTION_ACADEMICA;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HIBERNATE (Mantiene tu estructura intacta sin sobreescribirla)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

